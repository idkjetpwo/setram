<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setram - Chat-App</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="app">
        <!-- Anmeldebereich -->
        <div id="login-bereich">
            <h2>Anmelden bei Setram</h2>
            <input type="text" id="username" placeholder="Benutzername">
            <input type="password" id="password" placeholder="Passwort">
            <button onclick="anmelden()">Anmelden</button>
            <button onclick="registrieren()">Registrieren</button>
        </div>

        <!-- Hauptbereich (wird erst nach Anmeldung angezeigt) -->
        <div id="haupt-bereich" style="display: none;">
            <div class="sidebar">
                <h3>Freunde</h3>
                <input type="text" id="freund-username" placeholder="Freund per Benutzername hinzufügen">
                <button onclick="freundHinzufuegen()">Freund hinzufügen</button>
                <div id="freunde-liste"></div>
                <button onclick="abmelden()">Abmelden</button>
            </div>
            <div class="chat-bereich">
                <h3>Chat</h3>
                <div id="chat-nachrichten"></div>
                <input type="text" id="chat-eingabe" placeholder="Nachricht schreiben">
                <button onclick="nachrichtSenden()">Senden</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
