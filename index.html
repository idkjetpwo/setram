<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setram - Chat App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #1e2124;
            color: #dcddde;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        #fehlermeldung {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff4444;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 1000;
            animation: fadeIn 0.3s ease-in;
        }

        #login-page, #register-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #1e2124, #2f3136, #36393f, #1e2124);
            background-size: 400%;
            animation: gradientMove 15s ease infinite;
        }

        #login-page form, #register-page form {
            background-color: rgba(47, 49, 54, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.5s ease-in;
        }

        #login-page h2, #register-page h2 {
            color: #7289da;
            margin-bottom: 20px;
        }

        #main-page {
            display: none;
            flex-direction: row;
            height: 100vh;
        }

        .profil {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #2f3136;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profil i {
            color: #7289da;
            transition: color 0.3s ease;
        }

        .profil i:hover {
            color: #677bc4;
        }

        .sidebar {
            width: 250px;
            background-color: #2f3136;
            padding: 20px;
            border-right: 1px solid #202225;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .sidebar h3 {
            color: #7289da;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .chat-bereich {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background-color: #36393f;
            transition: all 0.3s ease;
        }

        #chat-nachrichten {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #40444b;
            border-radius: 10px;
            display: none;
            transition: all 0.3s ease;
        }

        #chat-nachrichten.active {
            display: block;
        }

        #chat-nachrichten div {
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 70%;
            word-wrap: break-word;
        }

        #chat-nachrichten div.sent {
            background-color: #7289da;
            margin-left: auto;
            text-align: right;
        }

        #chat-nachrichten div.received {
            background-color: #4f545c;
            margin-right: auto;
        }

        .chat-eingabe-bereich {
            display: flex;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .chat-eingabe-bereich.hidden {
            display: none;
        }

        #chat-toggle {
            background-color: #7289da;
            color: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background-color 0.3s ease;
        }

        #chat-toggle:hover {
            background-color: #677bc4;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: none;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input {
            background-color: #40444b;
            color: #dcddde;
        }

        button {
            background-color: #7289da;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        button:hover {
            background-color: #677bc4;
        }

        button i {
            font-size: 14px;
        }

        .footer {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #7289da;
            font-size: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 768px) {
            #app {
                flex-direction: column;
            }
            #main-page {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #202225;
                padding: 15px;
            }
            .chat-bereich {
                padding: 15px;
            }
            .profil {
                position: static;
                margin: 10px auto;
                justify-content: center;
            }
            #chat-nachrichten {
                max-height: 300px;
            }
            .chat-eingabe-bereich {
                flex-direction: column;
            }
            input, button {
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="fehlermeldung" style="display: none;"></div>
        <div id="login-page">
            <form>
                <h2>Sign In to Setram</h2>
                <input type="text" id="login-username" placeholder="Username">
                <input type="password" id="login-password" placeholder="Password">
                <button type="button" onclick="signIn()"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                <button type="button" onclick="showRegisterPage()"><i class="fas fa-user-plus"></i> Register</button>
            </form>
        </div>
        <div id="register-page" style="display: none;">
            <form>
                <h2>Register for Setram</h2>
                <input type="text" id="register-username" placeholder="Username">
                <input type="password" id="register-password" placeholder="Password">
                <button type="button" onclick="register()"><i class="fas fa-user-plus"></i> Register</button>
                <button type="button" onclick="showLoginPage()"><i class="fas fa-sign-in-alt"></i> Back to Sign In</button>
            </form>
        </div>
        <div id="main-page">
            <div class="profil">
                <i class="fas fa-user"></i>
                <span id="profil-username"></span>
                <button onclick="confirmSignOut()" title="Sign Out"><i class="fas fa-sign-out-alt"></i></button>
            </div>
            <div class="sidebar">
                <h3>Friends</h3>
                <input type="text" id="friend-username" placeholder="Add friend by username">
                <button onclick="addFriend()"><i class="fas fa-user-plus"></i> Add Friend</button>
                <div id="friends-list"></div>
                <h3>Blocked Users</h3>
                <div id="blocked-list"></div>
            </div>
            <div class="chat-bereich">
                <h3>Chat</h3>
                <button id="chat-toggle" onclick="toggleChat()"><i class="fas fa-comments"></i> Open Chat</button>
                <div id="chat-nachrichten"></div>
                <div class="chat-eingabe-bereich hidden">
                    <input type="text" id="chat-input" placeholder="Type a message">
                    <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Send</button>
                </div>
            </div>
        </div>
        <div class="footer">by Setrox</div>
    </div>
    <script>
        // Firebase-Konfiguration
        const firebaseConfig = {
            apiKey: "AIzaSyDcpRUmUWiQoS_UBt71fLVCiVX7AgADofQ",
            authDomain: "setram-abe73.firebaseapp.com",
            projectId: "setram-abe73",
            storageBucket: "setram-abe73.firebasestorage.app",
            messagingSenderId: "612633884731",
            appId: "1:612633884731:web:dda5b787caa1a8e74cc41e",
            measurementId: "G-VC7FK0FSGV"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Globale Variablen
        let currentUser = null;
        let selectedFriend = null;
        let currentUsername = null;
        let chatOpen = false;

        // Funktion, um Fehlermeldungen anzuzeigen
        function showError(message) {
            const errorDiv = document.getElementById('fehlermeldung');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        // Console-Erkennung und Refresh
        (function() {
            const devtools = /./;
            devtools.toString = function() {
                window.location.reload();
            };
            setInterval(() => {
                // Dummy-Aufruf, um DevTools-Erkennung auszulösen
                const test = devtools + '';
            }, 1000);
        })();

        // Seitenwechsel
        function showLoginPage() {
            document.getElementById('login-page').style.display = 'flex';
            document.getElementById('register-page').style.display = 'none';
        }

        function showRegisterPage() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('register-page').style.display = 'flex';
        }

        // Prüfen, ob ein Benutzer angemeldet ist
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user.uid;
                db.collection('users').doc(currentUser).get().then(doc => {
                    if (doc.exists) {
                        currentUsername = doc.data().username;
                        document.getElementById('profil-username').textContent = currentUsername;
                        document.getElementById('login-page').style.display = 'none';
                        document.getElementById('register-page').style.display = 'none';
                        document.getElementById('main-page').style.display = 'flex';
                        loadFriends();
                    } else {
                        showError('User data not found. Please register again.');
                        auth.signOut();
                    }
                }).catch(error => {
                    showError('Error loading user data.');
                });
            } else {
                currentUser = null;
                currentUsername = null;
                document.getElementById('login-page').style.display = 'flex';
                document.getElementById('register-page').style.display = 'none';
                document.getElementById('main-page').style.display = 'none';
                document.getElementById('profil-username').textContent = '';
            }
        });

        // Anmelden
        function signIn() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            if (!username || !password) {
                showError('Please enter a username and password.');
                return;
            }
            const email = `${username}@setram.com`;
            auth.signInWithEmailAndPassword(email, password)
                .catch(error => {
                    if (error.code === 'auth/wrong-password') {
                        showError('Wrong password. Please check your password.');
                    } else if (error.code === 'auth/user-not-found') {
                        showError('User not found. Please register.');
                    } else {
                        showError('Error signing in: ' + error.message);
                    }
                });
        }

        // Registrieren
        function register() {
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value.trim();
            if (!username || !password) {
                showError('Please enter a username and password.');
                return;
            }
            const email = `${username}@setram.com`;

            db.collection('users')
                .where('username', '==', username)
                .get()
                .then(query => {
                    if (!query.empty) {
                        showError('This username is already taken! Choose another.');
                        return;
                    }

                    auth.createUserWithEmailAndPassword(email, password)
                        .then(userCredential => {
                            const user = userCredential.user;
                            db.collection('users').doc(user.uid).set({
                                username: username,
                                friends: [],
                                blocked: []
                            }).then(() => {
                                document.getElementById('register-username').value = '';
                                document.getElementById('register-password').value = '';
                                showError('Registration successful! Please sign in.');
                                showLoginPage();
                            }).catch(error => {
                                showError('Error saving user data.');
                            });
                        })
                        .catch(error => {
                            if (error.code === 'auth/email-already-in-use') {
                                showError('This username is already taken! Choose another.');
                            } else {
                                showError('Error registering: ' + error.message);
                            }
                        });
                })
                .catch(error => {
                    showError('Error checking username availability.');
                });
        }

        // Abmelden mit Bestätigung
        function confirmSignOut() {
            if (confirm('Are you sure you want to sign out?')) {
                auth.signOut();
            }
        }

        // Freund hinzufügen
        function addFriend() {
            const friendUsername = document.getElementById('friend-username').value.trim();
            if (friendUsername === '') {
                showError('Please enter a username!');
                return;
            }

            db.collection('users')
                .where('username', '==', friendUsername)
                .get()
                .then(query => {
                    if (query.empty) {
                        showError('User not found! Check the username.');
                        return;
                    }

                    const friendId = query.docs[0].id;
                    if (friendId === currentUser) {
                        showError('You cannot add yourself as a friend!');
                        return;
                    }

                    db.collection('users').doc(currentUser).update({
                        friends: firebase.firestore.FieldValue.arrayUnion(friendId)
                    }).then(() => {
                        document.getElementById('friend-username').value = '';
                        showError('Friend added successfully!');
                    }).catch(error => {
                        showError('Error adding friend.');
                    });
                })
                .catch(error => {
                    showError('Error searching for friend.');
                });
        }

        // Freunde laden und anzeigen
        function loadFriends() {
            db.collection('users').doc(currentUser).onSnapshot(doc => {
                if (!doc.exists) return;
                const friends = doc.data().friends || [];
                const friendsList = document.getElementById('friends-list');
                friendsList.innerHTML = '';
                friends.forEach(friendId => {
                    db.collection('users').doc(friendId).get().then(friendDoc => {
                        if (friendDoc.exists) {
                            const friendUsername = friendDoc.data().username;
                            const friendDiv = document.createElement('div');
                            friendDiv.innerHTML = `
                                <i class="fas fa-user"></i> ${friendUsername}
                                <button onclick="selectFriend('${friendId}', '${friendUsername}')"><i class="fas fa-comment"></i> Chat</button>
                                <button onclick="removeFriend('${friendId}')"><i class="fas fa-trash"></i> Remove</button>
                                <button onclick="blockFriend('${friendId}')"><i class="fas fa-ban"></i> Block</button>
                            `;
                            friendsList.appendChild(friendDiv);
                        }
                    }).catch(error => {
                        showError('Error loading friends.');
                    });
                });
                loadBlocked();
            }, error => {
                showError('Error updating friends list.');
            });
        }

        // Blockierte Benutzer laden
        function loadBlocked() {
            db.collection('users').doc(currentUser).onSnapshot(doc => {
                if (!doc.exists) return;
                const blocked = doc.data().blocked || [];
                const blockedList = document.getElementById('blocked-list');
                blockedList.innerHTML = '';
                blocked.forEach(blockedId => {
                    db.collection('users').doc(blockedId).get().then(blockedDoc => {
                        if (blockedDoc.exists) {
                            const blockedUsername = blockedDoc.data().username;
                            const blockedDiv = document.createElement('div');
                            blockedDiv.innerHTML = `
                                <i class="fas fa-user-slash"></i> ${blockedUsername}
                                <button onclick="unblockFriend('${blockedId}')"><i class="fas fa-unlock"></i> Unblock</button>
                            `;
                            blockedList.appendChild(blockedDiv);
                        }
                    }).catch(error => {
                        showError('Error loading blocked users.');
                    });
                });
            }, error => {
                showError('Error updating blocked list.');
            });
        }

        // Freund auswählen, um zu chatten
        function selectFriend(friendId, friendUsername) {
            selectedFriend = friendId;
            document.querySelector('.chat-bereich h3').textContent = `Chat with ${friendUsername}`;
            if (!chatOpen) {
                toggleChat();
            }
            loadMessages();
        }

        // Freund entfernen
        function removeFriend(friendId) {
            db.collection('users').doc(currentUser).update({
                friends: firebase.firestore.FieldValue.arrayRemove(friendId)
            }).catch(error => {
                showError('Error removing friend.');
            });
        }

        // Freund blockieren
        function blockFriend(friendId) {
            db.collection('users').doc(currentUser).update({
                friends: firebase.firestore.FieldValue.arrayRemove(friendId),
                blocked: firebase.firestore.FieldValue.arrayUnion(friendId)
            }).catch(error => {
                showError('Error blocking friend.');
            });
        }

        // Freund entblockieren
        function unblockFriend(blockedId) {
            db.collection('users').doc(currentUser).update({
                blocked: firebase.firestore.FieldValue.arrayRemove(blockedId)
            }).catch(error => {
                showError('Error unblocking friend.');
            });
        }

        // Chat öffnen/schließen
        function toggleChat() {
            chatOpen = !chatOpen;
            const chatMessages = document.getElementById('chat-nachrichten');
            const chatInput = document.querySelector('.chat-eingabe-bereich');
            const chatToggle = document.getElementById('chat-toggle');
            if (chatOpen) {
                chatMessages.classList.add('active');
                chatInput.classList.remove('hidden');
                chatToggle.innerHTML = '<i class="fas fa-times"></i> Close Chat';
                loadMessages();
            } else {
                chatMessages.classList.remove('active');
                chatInput.classList.add('hidden');
                chatToggle.innerHTML = '<i class="fas fa-comments"></i> Open Chat';
            }
        }

        // Nachricht senden
        function sendMessage() {
            if (!selectedFriend) {
                showError('Select a friend to chat with!');
                return;
            }
            const message = document.getElementById('chat-input').value;
            if (message.trim() === '') return;
            const timestamp = new Date().toLocaleTimeString();
            db.collection('messages').add({
                senderId: currentUser,
                receiverId: selectedFriend,
                message: message,
                timestamp: timestamp
            }).then(() => {
                document.getElementById('chat-input').value = '';
            }).catch(error => {
                showError('Error sending message.');
            });
        }

        // Nachrichten in Echtzeit laden
        function loadMessages() {
            if (!selectedFriend || !chatOpen) return;
            const chatMessages = document.getElementById('chat-nachrichten');
            chatMessages.innerHTML = '';
            db.collection('messages')
                .where('senderId', 'in', [currentUser, selectedFriend])
                .where('receiverId', 'in', [currentUser, selectedFriend])
                .orderBy('timestamp')
                .onSnapshot(query => {
                    chatMessages.innerHTML = '';
                    query.forEach(doc => {
                        const data = doc.data();
                        const messageDiv = document.createElement('div');
                        messageDiv.className = data.senderId === currentUser ? 'sent' : 'received';
                        messageDiv.textContent = `${data.senderId === currentUser ? 'You' : 'Friend'} (${data.timestamp}): ${data.message}`;
                        chatMessages.appendChild(messageDiv);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    });
                }, error => {
                    showError('Error loading messages.');
                });
        }
    </script>
</body>
</html>
